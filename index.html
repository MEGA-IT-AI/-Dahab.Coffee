<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .menu-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .item-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
        }
        .item-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .price {
            font-weight: bold;
            color: #28a745;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-qty {
            background-color: #eee;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-qty:hover {
            background-color: #ddd;
        }
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 500px;
            margin: 0 auto;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: calc(100% - 40px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>منيو المطعم</h1>

    <!-- صنف البيتزا -->
    <div class="menu-card" id="item-1">
        <div class="item-title" id="itemName">بيتزا</div>
        <div class="item-details">
            <span>المقاس: <strong id="itemSize">M</strong></span>
            <span class="price"><span id="itemPrice">150</span> ج.م</span>
        </div>
        <div class="item-details">
            <span>الكمية:</span>
            <div class="quantity-control">
                <button class="btn-qty" onclick="changeQty(-1)">-</button>
                <span id="qtyValue" style="font-weight: bold;">1</span>
                <button class="btn-qty" onclick="changeQty(1)">+</button>
            </div>
        </div>
    </div>
</div>

<!-- ايقونة/زر الواتساب الثابت اسفل الصفحة -->
<button class="whatsapp-float" onclick="sendToWhatsApp()">
    إرسال الطلب عبر الواتساب 📱
</button>

<script>
    let quantity = 1;

    function changeQty(amount) {
        quantity += amount;
        if (quantity < 1) quantity = 1; // منع الأعداد السلبية أو الصفر
        document.getElementById('qtyValue').innerText = quantity;
    }

    function sendToWhatsApp() {
        const phone = "201010255123";
        const name = document.getElementById('itemName').innerText;
        const size = document.getElementById('itemSize').innerText;
        const price = document.getElementById('itemPrice').innerText;
        const totalPrice = parseInt(price) * quantity;

        const message = `طلب جديد:\n- الصنف: ${name}\n- المقاس: ${size}\n- الكمية: ${quantity}\n- إجمالي السعر: ${totalPrice} ج.م`;

        const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
